<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cowcloak">
  <title>{% block title %}Cowcloak{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-copied-label="{{ t.copied }}">
  <nav class="language-switch" aria-label="{{ t.language }}">
    <a
      class="language-link {% if language == 'de' %}current{% endif %}"
      href="/language/de?next={{ return_to|urlencode }}"
      {% if language == 'de' %}aria-current="true"{% endif %}
    >DE</a>
    <span aria-hidden="true">·</span>
    <a
      class="language-link {% if language == 'en' %}current{% endif %}"
      href="/language/en?next={{ return_to|urlencode }}"
      {% if language == 'en' %}aria-current="true"{% endif %}
    >EN</a>
  </nav>
  <main class="shell">{% block content %}{% endblock %}</main>
  <footer class="footer">Cowcloak {{ version }}</footer>
</body>
</html>
