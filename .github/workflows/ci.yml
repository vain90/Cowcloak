name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: node --check cowcloak/static/dialogs.js
      - run: node --check cowcloak/static/app.js
      - run: node --check cowcloak/static/stats.js
      - run: node --check cowcloak/static/sender-domain.js
      - run: node --check cowcloak/static/review.js
      - run: node --check cowcloak/static/review-behavior.js
      - run: node --check cowcloak/static/stats-mode.js
      - run: bash -n update.sh

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: >-
          pytest -q browser_tests
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output test-results
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: test-results
          if-no-files-found: ignore

  mailcow-feasibility-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/issue-58-mailcow-feasibility'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAILCOW_DIR: /tmp/mailcow-dockerized
      REPORT_DIR: /tmp/mailcow-feasibility
      MAILCOW_HOSTNAME: mail.mailcow-ci.test
      MAILCOW_HTTP_PORT: "8080"
      MAILCOW_API_KEY: cowcloak-ci-feasibility
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Mailcow feasibility probe
        run: bash .github/scripts/mailcow-feasibility.sh
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mailcow-feasibility-diagnostics
          path: /tmp/mailcow-feasibility
          if-no-files-found: ignore
          retention-days: 7
