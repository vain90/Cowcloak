name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: node --check cowcloak/static/app.js
      - run: node --check cowcloak/static/stats.js
      - run: node --check cowcloak/static/review.js
      - run: node --check cowcloak/static/review-behavior.js
      - run: node --check cowcloak/static/stats-mode.js
      - run: bash -n update.sh

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: >-
          pytest -q browser_tests
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output test-results
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: test-results
          if-no-files-found: ignore
