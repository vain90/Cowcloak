name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: node --check cowcloak/static/app.js
      - run: node --check cowcloak/static/stats.js
      - run: node --check cowcloak/static/review.js
      - run: node --check cowcloak/static/review-behavior.js
      - run: node --check cowcloak/static/stats-mode.js
      - run: bash -n update.sh
