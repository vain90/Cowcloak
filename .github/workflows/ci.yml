name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: node --check cowcloak/static/dialogs.js
      - run: node --check cowcloak/static/app.js
      - run: node --check cowcloak/static/stats.js
      - run: node --check cowcloak/static/sender-domain.js
      - run: node --check cowcloak/static/review.js
      - run: node --check cowcloak/static/review-behavior.js
      - run: node --check cowcloak/static/stats-mode.js
      - run: bash -n update.sh

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: >-
          pytest -q browser_tests
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output test-results
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: test-results
          if-no-files-found: ignore

  mailcow-feasibility-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/issue-58-mailcow-feasibility'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAILCOW_DIR: /tmp/mailcow-dockerized
      REPORT_DIR: /tmp/mailcow-feasibility
      MAILCOW_HOSTNAME: mail.mailcow-ci.test
      MAILCOW_HTTP_PORT: "8080"
      MAILCOW_API_KEY: cowcloak-ci-feasibility
    steps:
      - name: Record runner resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "=== Runner ==="
            uname -a
            echo
            echo "=== CPU ==="
            nproc
            lscpu
            echo
            echo "=== Memory ==="
            free -h
            echo
            echo "=== Filesystems ==="
            df -h
            echo
            echo "=== Docker ==="
            docker version
            echo
            docker compose version
          } | tee "$REPORT_DIR/runner-before.txt"

      - name: Clone current stable Mailcow
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master \
            https://github.com/mailcow/mailcow-dockerized.git \
            "$MAILCOW_DIR"
          git -C "$MAILCOW_DIR" rev-parse HEAD | tee "$REPORT_DIR/mailcow-commit.txt"

      - name: Generate CI Mailcow configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$MAILCOW_DIR"
          if [[ ! -L .env ]]; then
            ln -s mailcow.conf .env
          fi
          export MAILCOW_TZ=Etc/UTC
          export SKIP_CLAMD=y
          export FORCE=y
          ./generate_config.sh --dev

          set_conf() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" mailcow.conf; then
              sed -i "s|^${key}=.*|${key}=${value}|" mailcow.conf
            else
              printf '%s=%s\n' "$key" "$value" >> mailcow.conf
            fi
          }

          set_conf HTTP_PORT "$MAILCOW_HTTP_PORT"
          set_conf HTTP_BIND 127.0.0.1
          set_conf HTTPS_PORT 8443
          set_conf HTTPS_BIND 127.0.0.1
          set_conf HTTP_REDIRECT n
          set_conf SKIP_LETS_ENCRYPT y
          set_conf AUTODISCOVER_SAN n
          set_conf SKIP_CLAMD y
          set_conf SKIP_OLEFY y
          set_conf SKIP_FTS y
          set_conf USE_WATCHDOG n
          # The GitHub-hosted runner does not provide reliable ICMP/raw DNS egress.
          set_conf SKIP_UNBOUND_HEALTHCHECK y
          set_conf API_KEY "$MAILCOW_API_KEY"
          set_conf API_ALLOW_FROM "127.0.0.1,172.22.1.1"

          echo "127.0.0.1 $MAILCOW_HOSTNAME" | sudo tee -a /etc/hosts

          {
            echo "MAILCOW_HOSTNAME=$(grep '^MAILCOW_HOSTNAME=' mailcow.conf | cut -d= -f2-)"
            echo "HTTP_BIND=$(grep '^HTTP_BIND=' mailcow.conf | cut -d= -f2-)"
            echo "HTTP_PORT=$(grep '^HTTP_PORT=' mailcow.conf | cut -d= -f2-)"
            echo "SKIP_CLAMD=$(grep '^SKIP_CLAMD=' mailcow.conf | cut -d= -f2-)"
            echo "SKIP_OLEFY=$(grep '^SKIP_OLEFY=' mailcow.conf | cut -d= -f2-)"
            echo "SKIP_FTS=$(grep '^SKIP_FTS=' mailcow.conf | cut -d= -f2-)"
            echo "SKIP_UNBOUND_HEALTHCHECK=$(grep '^SKIP_UNBOUND_HEALTHCHECK=' mailcow.conf | cut -d= -f2-)"
            echo "ENABLE_IPV6=$(grep '^ENABLE_IPV6=' mailcow.conf | cut -d= -f2-)"
          } | tee "$REPORT_DIR/mailcow-config-summary.txt"

      - name: Pull Mailcow images
        shell: bash
        run: |
          set -euo pipefail
          cd "$MAILCOW_DIR"
          docker compose pull 2>&1 | tee "$REPORT_DIR/docker-pull.txt"
          {
            echo "=== Filesystems after image pull ==="
            df -h
            echo
            echo "=== Docker disk usage after image pull ==="
            docker system df
          } | tee "$REPORT_DIR/resources-after-pull.txt"

      - name: Start Mailcow
        shell: bash
        run: |
          set -euo pipefail
          cd "$MAILCOW_DIR"
          docker compose up -d
          docker compose ps --all | tee "$REPORT_DIR/compose-after-start.txt"

      - name: Wait for Mailcow web UI
        shell: bash
        run: |
          set -euo pipefail
          url="http://${MAILCOW_HOSTNAME}:${MAILCOW_HTTP_PORT}/"
          for attempt in $(seq 1 120); do
            if curl --noproxy '*' --fail --silent --show-error \
              --resolve "${MAILCOW_HOSTNAME}:${MAILCOW_HTTP_PORT}:127.0.0.1" \
              "$url" >/dev/null; then
              echo "Mailcow web UI became reachable after $((attempt * 5)) seconds."
              exit 0
            fi
            sleep 5
          done
          echo "Mailcow web UI did not become reachable within 10 minutes." >&2
          exit 1

      - name: Verify Mailcow API
        shell: bash
        run: |
          set -euo pipefail
          api_url="http://${MAILCOW_HOSTNAME}:${MAILCOW_HTTP_PORT}/api/v1/get/domain/all"
          response="$REPORT_DIR/api-domains.json"
          curl --noproxy '*' --fail --silent --show-error \
            --resolve "${MAILCOW_HOSTNAME}:${MAILCOW_HTTP_PORT}:127.0.0.1" \
            -H "X-API-Key: ${MAILCOW_API_KEY}" \
            -H "Accept: application/json" \
            "$api_url" > "$response"
          jq -e 'type == "array"' "$response" >/dev/null
          echo "Mailcow API returned a JSON array successfully."

      - name: Record running resources
        if: always()
        shell: bash
        run: |
          set +e
          cd "$MAILCOW_DIR" 2>/dev/null || exit 0
          {
            echo "=== Compose status ==="
            docker compose ps --all
            echo
            echo "=== Container resource snapshot ==="
            docker stats --no-stream
            echo
            echo "=== Filesystems ==="
            df -h
            echo
            echo "=== Docker disk usage ==="
            docker system df
          } | tee "$REPORT_DIR/resources-final.txt"

      - name: Capture Mailcow diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          cd "$MAILCOW_DIR" 2>/dev/null || exit 0
          {
            echo "=== Unbound inspect ==="
            docker inspect mailcowdockerized-unbound-mailcow-1 --format '{{json .State.Health}}'
            echo
            echo "=== Unbound logs ==="
            docker compose logs --no-color --tail=200 unbound-mailcow
          } | tee "$REPORT_DIR/unbound-failure.txt"
          docker compose logs --no-color --tail=300 > "$REPORT_DIR/mailcow.log" 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mailcow-feasibility-diagnostics
          path: /tmp/mailcow-feasibility
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down Mailcow
        if: always()
        shell: bash
        run: |
          set +e
          cd "$MAILCOW_DIR" 2>/dev/null || exit 0
          docker compose down -v --remove-orphans
