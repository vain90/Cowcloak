name: Mailcow feasibility

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mailcow-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAILCOW_DIR: /tmp/mailcow-dockerized
      REPORT_DIR: /tmp/mailcow-feasibility
      MAILCOW_HOSTNAME: mail.mailcow-ci.test
      MAILCOW_HTTP_PORT: "8080"
      MAILCOW_API_KEY: moolias-ci-feasibility
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Mailcow feasibility probe
        run: bash .github/scripts/mailcow-feasibility.sh
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mailcow-feasibility-diagnostics
          path: /tmp/mailcow-feasibility
          if-no-files-found: ignore
          retention-days: 7
