services:
  moolias:
    image: ghcr.io/vain90/moolias:${MOOLIAS_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MOOLIAS_PORT:-8080}:8000"
    volumes:
      - moolias-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  moolias-data:
